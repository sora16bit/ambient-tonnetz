<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
body { background: #000; overflow: hidden; font-family: monospace; }
canvas { display: block; cursor: none; }

#rotate-prompt {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: rgb(2,4,15);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px;
  font-family: monospace; color: rgba(190,202,225,0.85);
  text-align: center;
}
#rotate-prompt svg { opacity: 0.6; animation: rot 2s ease-in-out infinite; }
@keyframes rot {
  0%,100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}
#rotate-prompt p { font-size: 13px; letter-spacing: 2px; }

@media (max-width: 768px) and (orientation: portrait) {
  #rotate-prompt { display: flex; }
  canvas, #c { display: none; }
}
</style>
</head>
<body>
<div id="rotate-prompt">
  <p>ROTATE TO LANDSCAPE<br><span style="font-size:11px;opacity:0.5;letter-spacing:1px;">横向きにしてください</span></p>
</div>
<canvas id="c"></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
